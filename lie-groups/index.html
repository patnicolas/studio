<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lie group Studio</title>
  <!-- Fast, reliable Math.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(18, 24, 38, 0.92);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #f89540;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* Floating UI Panel */
    #ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, input[type="text"] {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: "Fira Code", monospace;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    /* Real-Time Probe Card */
    #probe-card {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.78rem;
      font-family: "Fira Code", monospace;
      line-height: 1.5;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .probe-row {
      display: flex;
      justify-content: space-between;
    }

    .probe-val {
      color: var(--accent);
      font-weight: 600;
    }

    .hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <p>Page under construction</p>
</body>
</html>
