<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometric Word Model Interactive Labs</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #f1f5f9;
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    p { color: #94a3b8; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card {
      background: #121826;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #f89540;
    }
    .card h2 { font-size: 1.1rem; color: #f89540; margin-bottom: 8px; }
    .card p { font-size: 0.85rem; margin: 0; }
  </style>
</head>
<body>
  <div><img src="../images/logo.png" alt="Geometric Deep Learning Logo"></div>
    <H1><center>Lie Group Simulation</center></H1>
  <p></p>
  <div>
    <center>

  <img src="../images/work_in_progress.png" alt="Simulation development in progress">
        </center>
      </div>
</body>
</html>
